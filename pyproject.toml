[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pce-research"
version = "0.1.0"
description = "Own-own persistence entropy excess and main-text topological causality"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "ripser==0.6.15"]

[project.optional-dependencies]
test = ["gudhi==3.11.0", "matplotlib==3.9.4"]
examples = ["gudhi==3.11.0", "matplotlib==3.9.4"]

[tool.setuptools]
packages = ["tpce"]

[tool.black]
target-version = ["py39"]
